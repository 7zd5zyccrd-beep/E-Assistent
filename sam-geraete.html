<!DOCTYPE html>
<!--
  SAM · Geräte auf dem Verteilerfoto
  v1.4 · 03.10.2026

  v1.4: vierpoliger FI nicht mehr in zwei Geräte geteilt. Prüftaste und
  Bestellnummer ("TEST", "2CSP204101R3400") stehen beim F 204 gut 2,5 TE
  rechts neben dem Text und wurden ein zweiter FI (IMG_6635.v1). Wie schon
  die Marke dürfen sie beim vierpoligen bis 3,6 TE entfernt liegen. Nur dieses
  Foto ändert sich.

  v1.3: Nummernstreifen (Jean, 03.10.2026). Über oder unter den Reihen
  trägt die Abdeckung oft fortlaufende Nummern, eine je TE - gedruckt oder
  nur eingeprägt. Nach der Geräteerkennung (die unverändert bleibt) wird je
  Reihe darüber und darunter die Zahlenzeile gesucht, Feld für Feld gelesen
  (Prägungen fand die Textsuche nicht) und auf fortlaufende Zahlen im
  Abstand einer TE geprüft. Jedes Gerät bekommt die Nummer(n) seiner Felder
  ("streifen", z. B. "13-14") und "streifenSicher" - sicher nur bei
  mindestens drei passenden Zahlen, eindeutiger Reihe und Feldern klar unter
  dem Gerät. Breite Geräte ohne dichten linken Nachbarn tragen den Aufdruck
  oft rechts (FI/LS über 4 TE, IMG_8029.v1) - ihre Nummer bleibt unsicher.
  Lernsätze: 93 sichere Nummern richtig, keine falsch; Geräte unverändert.
  Der Bericht nennt je Reihe, was gefunden wurde oder warum nicht.

  v1.2: Durchsicht aller Lernsätze, Bild für Bild (Art 410 -> 510, mit
  Aufdruck 370 -> 488 von 645). Die Regeln stehen mit Bildnamen am Ort im
  Code; die wichtigsten:
  - gezielte Nachlese für Geräte ohne Art oder Aufdruck, für unsichere LS
    und für Lücken über 1 TE in einer Reihe (eigene Kästen, nur Wörter aus
    der Lücke);
  - Überspannungsableiter über große rote Flächen und die um 90° gedrehte
    Lesung ("DEHNguard", "DG MOD 275");
  - Marke und Typnummer gehören zusammen: ABB-Logo links neben LS und
    Stromstoßschalter, Marke unten links beim legrand-FI, Marke am rechten
    Rand beim vierpoligen FI;
  - Verleser von Marken und Typnummern (A8D, ARB, AB8, 8261, S25i, EP6I, 2S1,
    £280-16-10/12 ...), hager-Typnummern tragen den Wert (MBN 116 = B16);
  - Baugleiche stützen sich auch beim FI (F 202) und über die Marke, wenn
    der Nennstrom am Gerät steht;
  - Türblatt und Legende: gleiche Zeile mehrfach untereinander und
    "13-15 Hauptschalter" sind keine Geräte.

  v1.1: Aufdruck der LS (Jean: LS erkannt, aber ohne B 16 - auch in der
  ersten Reihe). In den Lernsätzen fehlte er bei 41 von 302 LS:
  "816"/"316" statt B16 (B als 8 oder 3 gelesen), "B" und "16" als zwei
  Wörter. Neu: 8/3 vor einem üblichen Nennstrom gilt als B; ein einzelnes
  B/C/K und eine einzelne Stromzahl auf demselben Gerät ergeben zusammen den
  Aufdruck (unsicher - die App markiert ihn); und baugleiche Geräte im
  selben Verteiler (gleiche Typnummer, z.B. S261) stützen sich: tragen
  mindestens zwei sicher denselben Aufdruck und kein anderer, bekommt ein
  baugleiches Gerät ohne sicheren Aufdruck diesen Wert.

  v1.0: ein Gerät trägt eine Marke. Jeans Verteiler, zwei ABB S 261 B 16
  nebeneinander: die Marke steht links, die Angaben rechts; "6000" des linken
  lag weniger als 0,45 TE neben "ABB" des rechten, und beide wurden zu einem
  Gerät verkettet (nur in manchen Lagen im Bild). Eine Gruppe mit zwei
  deutlich getrennten Marken (Mitten mehr als 0,6 TE auseinander) wird
  geteilt; jedes Wort kommt zur Marke, die links von ihm beginnt.

  v0.9: Speicher. Auf Jeans iPhone meldete iOS beim Start der Hinter-
  grundprozesse "Out of memory" - neben der Erkennung der Beschreibung war
  für zwei weitere Erkennungen kein Platz. Die Prozesse starten jetzt erst
  beim Lesen und werden danach beendet; "vorbereiten" lädt nur Bibliothek,
  Modell und Rechenkern in den Zwischenspeicher, ohne Rechenspeicher zu
  belegen. Reicht der Speicher nicht, liest die Seite allein und meldet
  "1 Prozess (Speicher knapp)".

  v0.8: an Kachelrändern abgeschnittene Wörter verlieren gegen vollständige
  (ein Randwort, das in einem überlappenden längeren Wort enthalten ist).
  Jeans Verteiler: zwei gleiche ABB S 261 B 16, rechts fehlte B 16. Lag ein
  Aufdruck auf einer Kachelgrenze, las die eine Kachel "16", die Nachbar-
  kachel "B16" - und beim Zusammenführen gewann das sicherer gelesene, oft
  das abgeschnittene. Je nach Lage im Bild traf es das linke, das rechte
  oder beide Geräte, aus einem Gerät wurden auch zwei.

  v0.7: der Aufdruck wird auch in den Wörtern gesucht, die kein Gerät
  kennzeichnen, aber auf ihm stehen (Jean, eigener Verteiler: ABB F 372 mit
  "In 25 A" - das "In 25 A" war kein Anker und fiel weg, der FI blieb ohne
  Nennstrom). Zuerst gilt, was die Anker sagen; nur wenn dort nichts steht,
  zählen die übrigen Wörter über dem Gerät.

  v0.6: schneller über mehrere Kerne. Die Kacheln sind voneinander
  unabhängig; sie gehen jetzt an 2-3 Hintergrundprozesse (Web Worker) mit je
  eigener Erkennung statt nacheinander durch eine. Geht das nicht (alter
  Browser, Fehler beim Laden), liest die Seite wie bisher allein. Dazu meldet
  die Seite den Fortschritt als Anteil (für die Anzeige in der App) und womit
  gerechnet wird (WebGPU oder WASM, Zahl der Prozesse).

  v0.5: ein FI wird nicht mehr in zwei Geräte zerlegt. Links stehen Marke,
  Typ und Nennwerte ("ABB F202 A 25A 0,03A"), rechts Prüftaste und
  Bestellnummer ("TEST", "2CSF202101R1250") - als zwei senkrechte Gruppen
  wurden daraus zwei FI (24 Paare in den Lernsätzen, 5 in den
  Musterlösungen). Auf Jeans eigenem Verteiler bestätigte das den falsch
  gelesenen zweiten FI auf dem Blatt.

  v0.4: normierter Aufdruck je Gerät (B16, 25A/30mA, B16/30mA, 63A) und
  Einbettung in den E-Assistenten (?einbettung, wie paddle-test.html) - für
  den ersten Versuch, Beschriftungsblatt und Verteiler zu verknüpfen.

  v0.3: zweiter, vergrößerter Durchgang über den Gerätebereich, wenn die
  Schrift klein ist (Foto aus Abstand); ABB-Leseschwankungen.

  v0.2: Geräte zuerst (senkrechte Gruppen von Aufdrucken), Reihen danach;
  allgemeine Gerätetexte (6000, 230/400, IP40) als weitere Anker.

  v0.1: Stufe 1, Etappe (a) (Jean, 26.09.2026). Das Foto des Verteilers wird
  in voller Auflösung kachelweise gelesen - im ganzen, auf 2000 Punkte
  verkleinerten Foto gingen die kleinen Aufdrucke der ABB-Geräte unter
  ("821" statt "B16", IMG_6744). Aus den Wörtern entstehen Reihen und Geräte:
  Herstellernamen und Gerätekennungen sind die Anker, je Gerät steht meist
  genau ein Herstellername. Gedeutet wird die Art (LS, FI, FI/LS,
  Hauptschalter, Überspannungsableiter, Stromstoßschalter, Trafo); was sich
  nicht zuordnen lässt, bleibt "—". Aufdrucke und TE kommen in (b) und (c).
-->

<h1>SAM · Geräte <span class="ver">v1.4 · 03.10.2026</span></h1>
<p><button id="start">Erkennung laden</button> <input type="file" id="datei" accept="image/*" disabled></p>
<pre id="aus"></pre>

<script type="module">
const VERSION = 'v1.4 · 03.10.2026';
const WEGE = [
  'https://esm.sh/ppu-paddle-ocr/web?external=onnxruntime-web',
  'https://esm.sh/ppu-paddle-ocr/web',
  'https://cdn.jsdelivr.net/npm/ppu-paddle-ocr/+esm'
];
let dienst = null;
async function starte(){
  if((await helferStarten()).length) return;
  await starteAllein();
}
async function starteAllein(){
  if(dienst) return;
  let Sdk = null, fehler = [];
  for(const u of WEGE){
    try{ const m = await import(u); Sdk = m.PaddleOcrService || (m.default && m.default.PaddleOcrService); if(Sdk) break; }
    catch(e){ fehler.push(e.message); }
  }
  if(!Sdk) throw new Error('Bibliothek nicht geladen: ' + fehler.join(' | '));
  dienst = new Sdk({recognition:{mainThreadYieldMs: 24}, debugging:{verbose:false}});
  await dienst.initialize();
  schwelleNachruesten();
}
/* v0.2: Schwelle für die Textkarte des Detektors, wie paddle-test.html seit
   v0.37 bei der Notlesung. Ohne sie nimmt die Bibliothek jeden Wert über
   null als Text; auf einem Verteiler stehen die Aufdrucke so dicht, dass
   ganze Geräte zu einem Kasten verschmolzen und als Unsinn gelesen wurden
   ("CCCC", "D" – IMG_8029, der FI "F 372" fehlte ganz). */
let KARTEN_SCHWELLE = 0.3, schwelleStand = 'nicht geprüft';
function schwelleNachruesten(){
  try{
    let p = dienst && dienst.detector ? Object.getPrototypeOf(dienst.detector) : null;
    while(p && !Object.prototype.hasOwnProperty.call(p, 'runInference')) p = Object.getPrototypeOf(p);
    if(!p){ schwelleStand = 'nicht nachrüstbar'; return; }
    if(!p.__samSchwelle){
      const alt = p.runInference;
      p.runInference = async function(){
        const d = await alt.apply(this, arguments);
        if(d && KARTEN_SCHWELLE > 0){ for(let i = 0; i < d.length; i++) if(d[i] < KARTEN_SCHWELLE) d[i] = 0; }
        return d;
      };
      p.__samSchwelle = true;
    }
    schwelleStand = 'Schwelle ' + KARTEN_SCHWELLE;
  }catch(e){ schwelleStand = 'nicht nachrüstbar (' + e.message + ')'; }
}

/* ==================== Mehrere Kerne (v0.6) ====================
   Jeder Hintergrundprozess lädt die Bibliothek selbst (ohne Importmap, daher
   die Wege ohne "external"), rüstet die Kartenschwelle nach und liest
   Kacheln, die als ImageBitmap kommen. Zurück gehen fertige Wörter. */
const HELFER_WEGE = ['https://esm.sh/ppu-paddle-ocr/web?deps=onnxruntime-web@1.23.0', 'https://cdn.jsdelivr.net/npm/ppu-paddle-ocr/+esm'];
const HELFER_CODE = `
const WEGE = ${JSON.stringify(HELFER_WEGE)};
let dienst = null, KARTEN_SCHWELLE = 0.3;
${woerterAusText()}
async function starte(){
  let Sdk = null, fehler = [];
  for(const u of WEGE){
    try{ const m = await import(u); Sdk = m.PaddleOcrService || (m.default && m.default.PaddleOcrService); if(Sdk) break; }
    catch(e){ fehler.push(e.message); }
  }
  if(!Sdk) throw new Error('Bibliothek nicht geladen: ' + fehler.join(' | '));
  dienst = new Sdk({debugging:{verbose:false}});
  await dienst.initialize();
  let p = dienst.detector ? Object.getPrototypeOf(dienst.detector) : null;
  while(p && !Object.prototype.hasOwnProperty.call(p, 'runInference')) p = Object.getPrototypeOf(p);
  if(p && !p.__samSchwelle){
    const alt = p.runInference;
    p.runInference = async function(){
      const d = await alt.apply(this, arguments);
      if(d && KARTEN_SCHWELLE > 0){ for(let i = 0; i < d.length; i++) if(d[i] < KARTEN_SCHWELLE) d[i] = 0; }
      return d;
    };
    p.__samSchwelle = true;
  }
  return ((dienst.options && dienst.options.session && dienst.options.session.executionProviders) || []).map(x => typeof x === 'string' ? x : x.name).join('+');
}
self.onmessage = async e => {
  const d = e.data;
  try{
    if(d.art === 'start'){ KARTEN_SCHWELLE = d.schwelle; self.postMessage({id: d.id, ok: true, rechner: await starte()}); return; }
    const c = new OffscreenCanvas(d.bild.width, d.bild.height);
    c.getContext('2d').drawImage(d.bild, 0, 0); d.bild.close();
    if(d.art === 'kaesten'){ self.postMessage({id: d.id, ok: true, texte: await kaestenIn(dienst, c, d.kaesten)}); return; }
    const erg = await dienst.recognize(c, {noCache: true});
    self.postMessage({id: d.id, ok: true, woerter: woerterAus(erg, d.x, d.y)});
  }catch(err){ self.postMessage({id: d.id, ok: false, fehler: String(err && err.message || err)}); }
};`;
function woerterAusText(){ return woerterAus.toString() + '\n' + kaestenIn.toString(); }
/* v1.3: nur lesen, ohne Textsuche - für vorgegebene Kästen (Felder des
   Nummernstreifens: einzelne Ziffern fand die Textsuche nicht, IMG_5185.v1) */
async function kaestenIn(dienst, c, kaesten){
  const erg = await dienst.recognitor.run(c, kaesten, dienst.options.recognition && dienst.options.recognition.charactersDictionary, 'je-kasten');
  /* die Bibliothek lässt leere und unsichere Lesungen weg und ordnet nach
     Zeilen - zugeordnet wird über die linke Kante (gleiche Höhe, gleiche Breite) */
  const flach = [].concat(...(erg || []).map(e => Array.isArray(e) ? e : [e])).filter(e => e && e.box);
  const raus = kaesten.map(() => ({text: '', conf: 0}));
  flach.forEach(e => {
    let best = -1, bd = Infinity;
    kaesten.forEach((k, i) => { const d = Math.abs(k.x - e.box.x) + Math.abs(k.y - e.box.y); if(d < bd){ bd = d; best = i; } });
    if(best >= 0 && bd < 0.1 * kaesten[best].width + 3) raus[best] = {text: String(e.text || ''), conf: e.confidence || 0};
  });
  return raus;
}
let helfer = null, helferStand = 'allein', helferFehler = '';
/* v0.9: nur Zwischenspeicher füllen - Bibliothek (ohne sie zu starten),
   Modelle und Rechenkern. Kein Rechenspeicher, keine Prozesse. */
let vorgeladen = null;
function vorladen(){
  if(vorgeladen) return vorgeladen;
  const M = 'https://huggingface.co/snowfluke/ppu-paddle-ocr-models/resolve/main';
  const O = 'https://cdn.jsdelivr.net/npm/onnxruntime-web@1.23.0/dist/';
  const holen = u => fetch(u, {referrerPolicy: 'no-referrer'}).then(r => r.arrayBuffer()).catch(() => null);
  vorgeladen = Promise.all([
    import(HELFER_WEGE[0]).catch(() => null),
    holen(M + '/detection/ort/PP-OCRv6_tiny_det.ort'), holen(M + '/recognition/ort/PP-OCRv6_tiny_rec.ort'),
    holen(M + '/recognition/ppocrv6_tiny_dict.txt'),
    holen(O + 'ort-wasm-simd-threaded.jsep.mjs'), holen(O + 'ort-wasm-simd-threaded.jsep.wasm')
  ]).then(() => true);
  return vorgeladen;
}
function helferBeenden(){
  if(helfer) helfer.forEach(h => h.w.terminate());
  helfer = null;
}
async function helferStarten(){
  if(helfer !== null) return helfer;
  helfer = []; helferFehler = '';
  /* auf Telefon und Tablet höchstens 2 - jeder Prozess hält ein eigenes
     Modell im Speicher, und iOS beendet eine Seite, die zu viel braucht */
  const mobil = /iPhone|iPad|Android/i.test(navigator.userAgent) || (navigator.maxTouchPoints > 1 && /Mac/.test(navigator.userAgent));
  const n = Math.max(1, Math.min(mobil ? 2 : 3, (navigator.hardwareConcurrency || 2) - 1));
  if(n < 2 || typeof Worker === 'undefined' || typeof OffscreenCanvas === 'undefined' || window.__alleinLesen) return helfer;
  try{
    const url = URL.createObjectURL(new Blob([HELFER_CODE], {type: 'text/javascript'}));
    const alle = [];
    for(let i = 0; i < n; i++){
      const w = new Worker(url, {type: 'module'});
      const h = {w, n: 0, offen: new Map()};
      w.onmessage = e => { const o = h.offen.get(e.data.id); if(o){ h.offen.delete(e.data.id); o(e.data); } };
      w.onerror = e => { h.offen.forEach(o => o({ok: false, fehler: e.message || 'Worker'})); h.offen.clear(); };
      h.frage = (d, uebergabe) => new Promise(res => { const id = ++h.n; h.offen.set(id, res); w.postMessage(Object.assign({id}, d), uebergabe || []); });
      alle.push(h);
    }
    const antworten = await Promise.all(alle.map(h => h.frage({art: 'start', schwelle: KARTEN_SCHWELLE})));
    if(antworten.every(a => a.ok)){ helfer = alle; helferStand = n + ' Prozesse, ' + (antworten[0].rechner || '?'); schwelleStand = 'Schwelle ' + KARTEN_SCHWELLE + ' (je Prozess)'; }
    else { alle.forEach(h => h.w.terminate()); helferFehler = antworten.find(a => !a.ok).fehler || '?'; }
  }catch(e){ helferFehler = e.message; }
  return helfer;
}
function rechnerText(){
  if(helfer && helfer.length) return helferStand;
  const eps = dienst && dienst.options && dienst.options.session && dienst.options.session.executionProviders;
  return '1 Prozess, ' + ((eps || []).map(x => typeof x === 'string' ? x : x.name).join('+') || '?') +
         (helferFehler ? (/memory|speicher/i.test(helferFehler) ? ' (Speicher knapp)' : ' (Prozesse nicht gestartet)') : '');
}

/* ==================== Lesen ==================== */
/* Kacheln von 1200 Punkten mit 25 % Überlappung aus dem Original (höchstens
   4032 lang). Die Erkennung verkleinert intern; eine Kachel bleibt dabei nah
   an ihrer Auflösung, das ganze Foto nicht. */
function woerterAus(erg, dx, dy){
  const raus = [];
  (Array.isArray(erg.lines) ? erg.lines : []).forEach(zeile => {
    const ws = Array.isArray(zeile) ? zeile : (zeile && zeile.words) ? zeile.words : [zeile];
    ws.forEach(w => {
      const b = w && (w.box || w.bbox || w.rect); if(!b) return;
      const x0 = (b.x !== undefined) ? b.x : b.x0, y0 = (b.y !== undefined) ? b.y : b.y0;
      const br = (b.width !== undefined) ? b.width : (b.x1 - b.x0), ho = (b.height !== undefined) ? b.height : (b.y1 - b.y0);
      const text = String(w.text || '').replace(/[^ -ɏ]/g, '').trim();
      if(!/[0-9A-Za-z]/.test(text)) return;
      raus.push({text, conf: w.confidence ?? w.score ?? 0, x0: x0 + dx, y0: y0 + dy, x1: x0 + br + dx, y1: y0 + ho + dy});
    });
  });
  return raus;
}
async function kaestenLesen(bild, kaesten){
  if(helfer && helfer.length){
    const b = await createImageBitmap(bild);
    const a = await helfer[0].frage({art: 'kaesten', bild: b, kaesten}, [b]);
    if(!a.ok) throw new Error(a.fehler);
    return a.texte;
  }
  if(!dienst){ helfer = []; await starteAllein(); }
  return kaestenIn(dienst, bild, kaesten);
}
async function kachelnLesen(bild, fortschritt){
  const K = window.__kachel || 1200, U = Math.round(K / 4), alle = [];
  const xs = [], ys = [];
  for(let x = 0; ; x += K - U){ xs.push(Math.min(x, Math.max(0, bild.width - K))); if(x + K >= bild.width) break; }
  for(let y = 0; ; y += K - U){ ys.push(Math.min(y, Math.max(0, bild.height - K))); if(y + K >= bild.height) break; }
  const kacheln = [];
  for(const y of ys) for(const x of xs) kacheln.push({x, y});
  const bw = Math.min(K, bild.width), bh = Math.min(K, bild.height);
  let fertig = 0;
  const melde = () => { fertig++; if(fortschritt) fortschritt(fertig / kacheln.length); };
  /* v0.8: berührt ein Wort den Rand einer Kachel, der nicht zugleich Bildrand
     ist, ist es womöglich abgeschnitten */
  const rand = (w, k) => { const d = Math.max(3, 0.25 * (w.y1 - w.y0));
    return (k.x > 0 && w.x0 - k.x <= d) || (k.x + bw < bild.width && k.x + bw - w.x1 <= d) ||
           (k.y > 0 && w.y0 - k.y <= d) || (k.y + bh < bild.height && k.y + bh - w.y1 <= d); };
  if(helfer && helfer.length){
    /* v0.6: jeder Prozess holt sich die nächste freie Kachel; die Wörter
       kommen danach in der alten Reihenfolge zusammen, damit das Ergebnis
       nicht von der Laufzeit abhängt */
    const je = new Array(kacheln.length);
    let naechste = 0;
    await Promise.all(helfer.map(async h => {
      while(naechste < kacheln.length){
        const i = naechste++, k = kacheln[i];
        const b = await createImageBitmap(bild, k.x, k.y, bw, bh);
        const a = await h.frage({art: 'lesen', bild: b, x: k.x, y: k.y}, [b]);
        if(!a.ok) throw new Error(a.fehler);
        je[i] = a.woerter.map(w => Object.assign(w, {kachel: k.x + ',' + k.y, rand: rand(w, k)}));
        melde();
      }
    }));
    je.forEach(w => alle.push(...w));
  } else {
    if(!dienst){ helfer = []; await starteAllein(); }
    for(const k of kacheln){
      const c = document.createElement('canvas');
      c.width = bw; c.height = bh;
      c.getContext('2d').drawImage(bild, k.x, k.y, c.width, c.height, 0, 0, c.width, c.height);
      const erg = await dienst.recognize(c, {noCache: true});
      alle.push(...woerterAus(erg, k.x, k.y).map(w => Object.assign(w, {kachel: k.x + ',' + k.y, rand: rand(w, k)})));
      melde();
    }
  }
  /* Doppelte aus der Überlappung: liegt die Mitte eines Kastens in einem
     anderen, bleibt der sicherere und bei Gleichstand der längere */
  return zusammenfuehren(alle);
}
function zusammenfuehren(alle){
  /* v0.2: nur Kästen ähnlicher Größe verdrängen sich - ein Klecks von
     250 × 240 Punkten ("D", IMG_8029) schluckte sonst alle Aufdrucke des FI
     darunter. Kästen, die viel höher als eine Schriftzeile sind, sind kein
     Aufdruck. */
  const hoehen = alle.map(w => w.y1 - w.y0).sort((a, b) => a - b);

  reihen.forEach(r => {

  alle.forEach(g => { if(g.art === 'LS' && g.aufdruck && g.aufdruckSicher){ if(g.typ) zaehlen(sichere, g.typ + '|' + g.aufdruck); if(g.marke) zaehlen(sichereMarke, g.marke + '|' + g.aufdruck); } });
  alle.forEach(g => {
    if(g.art !== 'LS' || (g.aufdruck && g.aufdruckSicher)) return;
    let werte = g.typ ? [...sichere].filter(([k]) => k.startsWith(g.typ + '|')) : [];
    /* v1.2: ohne Typnummer über die Marke - aber nur, wenn das Gerät selbst den
       Nennstrom trägt ("AEG" und "16", die Nachbarn sicher B16; IMG_6539.v1) */

  });

     sicherem "25A" (IMG_6670.v1). Bei nur einem Vorbild bleibt der Wert unsicher. */
  const fiTyp = g => { for(const x of g.anker.map(a => a.w.text).concat(g.beiText)){ const m = /^F\s?([23]\d{2})/i.exec(x.trim()); if(m) return 'F' + m[1]; } return ''; };

  alle.forEach(g => { if(g.art === 'FI' && g.aufdruck && fiTyp(g)){ const k = fiTyp(g) + '|' + g.aufdruck; fiSicher.set(k, (fiSicher.get(k) || 0) + 1); } });
  alle.forEach(g => {
    if(g.art !== 'FI' || g.aufdruck || !fiTyp(g)) return;
    const werte = [...fiSicher].filter(([k]) => k.startsWith(fiTyp(g) + '|'));
    if(werte.length !== 1) return;
    g.aufdruck = werte[0][0].split('|')[1]; g.aufdruckSicher = werte[0][1] >= 2; g.vonBaugleichen = true;
  });
  return {h, te, reihen: reihen.map(r => ({y: r.ym, te, geraete: r.geraete}))};
}

async function rotFlaechenLesen(c, g){
  const s = 4, w = Math.floor(c.width / s), hgt = Math.floor(c.height / s);
  const k = document.createElement('canvas'); k.width = w; k.height = hgt;
  const kx = k.getContext('2d', {willReadFrequently: true}); kx.drawImage(c, 0, 0, w, hgt);
  const px = kx.getImageData(0, 0, w, hgt).data;
  const maske = new Uint8Array(w * hgt);
  for(let i = 0; i < w * hgt; i++){ const R = px[4*i], G = px[4*i+1], B = px[4*i+2]; if((R > 70 && R > 1.7 * G && R > 1.5 * B) || (R > 35 && R > 2.5 * G && R > 2.5 * B)) maske[i] = 1; }
  const te = (g.te || 6 * (g.h || 30)) / s, hh = (g.h || 30) / s;
  const gesehen = new Uint8Array(w * hgt), flaechen = [];

    if(!maske[i] || gesehen[i]) continue;
    const st = [i]; gesehen[i] = 1; let n = 0, x0 = w, x1 = 0, y0 = hgt, y1 = 0;
    while(st.length){
      const j = st.pop(), x = j % w, y = (j - x) / w; n++;
      if(x < x0) x0 = x; if(x > x1) x1 = x; if(y < y0) y0 = y; if(y > y1) y1 = y;
      for(const d of [-1, 1, -w, w]){ const q = j + d; if(q >= 0 && q < w * hgt && !gesehen[q] && maske[q] && !(d === 1 && x === w - 1) && !(d === -1 && x === 0)){ gesehen[q] = 1; st.push(q); } }
    }
    /* mindestens 1,5 TE breit und 3 Worthöhen hoch, und überwiegend gefüllt */
    /* auch schmale Teile (rote Seitenwände der Module) - die Größe zählt erst am Kasten */
    /* v1.2: aber kein dünnes rotes Kabel quer durchs Bild - unter 8 % seines
       Kastens gefüllt; es zog den Kasten der Module unter ein Fünftel (IMG_8029.v2) */
    if(n > 0.15 * te * hh && n >= 0.08 * (x1 - x0 + 1) * (y1 - y0 + 1)) flaechen.push({x0: x0 * s, x1: (x1 + 1) * s, y0: y0 * s, y1: (y1 + 1) * s, n});

     zu einem Kasten, dann erst nach Größe sieben */

    const a = flaechen[i], b = flaechen[j];
    const ueber = Math.min(a.x1, b.x1) - Math.max(a.x0, b.x0);
    const luecke = Math.max(a.y0, b.y0) - Math.min(a.y1, b.y1);
    const lueckeX = Math.max(a.x0, b.x0) - Math.min(a.x1, b.x1);

     großen (IMG_5185: S 261 B 16 neben dem F 372) bekamen beim ganzen Bild
     keine eigene Vergrößerung, weil die mittlere Schrifthöhe groß war. */
  /* v1.2: auch LS mit unsicherem Aufdruck ("8" und "16") - unsicher heißt nachlesen */
  const offen = g.reihen.flatMap(r => r.geraete).filter(x => x.art === '—' || (/^(LS|FI|FI\/LS)$/.test(x.art) && !x.aufdruck) || (x.art === 'LS' && x.aufdruckSicher === false));
  /* v1.2: auch Lücken in einer Reihe - zwischen zwei Geräten mehr als 1 TE
     ohne Fund (bis 6 TE); dort steht oft ein Gerät, dessen Aufdruck beim
     ganzen Bild nicht gelesen wurde (IMG_6698.v1) */
  const teL = g.te || 6 * g.h, hhL = g.h || 30, luecken = [];
  g.reihen.forEach(r => {
    const y0 = Math.min(...r.geraete.map(x => x.y0)), y1 = Math.max(...r.geraete.map(x => x.y1));
    const gs = r.geraete.slice().sort((a, b) => a.x0 - b.x0);
    for(let i = 0; i + 1 < gs.length; i++){
      const a = gs[i], b = gs[i + 1], l = b.x0 - a.x1;
      if(l > teL && l < 6 * teL) luecken.push({x0: a.x1 - 0.2 * teL, x1: b.x0 + 0.2 * teL, y0, y1});
    }
  });
  if((offen.length || luecken.length) && !window.__ohneGezielt){
    const te = teL, hh = hhL;
    let kaesten = offen.map(x => ({x0: Math.max(0, x.x0 - te), x1: Math.min(c.width, x.x1 + te),
                                   y0: Math.max(0, x.y0 - 4 * hh), y1: Math.min(c.height, x.y1 + 8 * hh)}));
    /* überlappende Kästen zusammenlegen */
    for(let i = 0; i < kaesten.length; i++) for(let j = i + 1; j < kaesten.length; j++){
      const a = kaesten[i], b = kaesten[j];
      if(a.x0 < b.x1 && b.x0 < a.x1 && a.y0 < b.y1 && b.y0 < a.y1){
        a.x0 = Math.min(a.x0, b.x0); a.x1 = Math.max(a.x1, b.x1); a.y0 = Math.min(a.y0, b.y0); a.y1 = Math.max(a.y1, b.y1);
        kaesten.splice(j, 1); j = i;
      }
    }
    /* Lücken für sich, nicht mit den Kästen der Geräte zusammengelegt - ein
       anderer Ausschnitt las das Gerät daneben schlechter (IMG_6676.v1) */
    kaesten = kaesten.concat(luecken.map(x => ({x0: Math.max(0, x.x0 - te), x1: Math.min(c.width, x.x1 + te),
                                                 y0: Math.max(0, x.y0 - 4 * hh), y1: Math.min(c.height, x.y1 + 8 * hh)})));
    /* so weit vergrößern, dass die Schrift etwa 40 Punkte hoch wird, mindestens 2-fach, höchstens 4-fach */
    const f3 = window.__gezieltF || Math.max(2, Math.min(4, (window.__gezieltZiel || 40) / hh));
    let neu = [];
    for(const k of kaesten){
      const g3 = document.createElement('canvas');
      g3.width = Math.round((k.x1 - k.x0) * f3); g3.height = Math.round((k.y1 - k.y0) * f3);
      const k3 = g3.getContext('2d'); k3.imageSmoothingQuality = 'high';
      k3.drawImage(c, k.x0, k.y0, k.x1 - k.x0, k.y1 - k.y0, 0, 0, g3.width, g3.height);
      neu = neu.concat((await kachelnLesen(g3)).map(w => Object.assign(w, {x0: k.x0 + w.x0 / f3, x1: k.x0 + w.x1 / f3, y0: k.y0 + w.y0 / f3, y1: k.y0 + w.y1 / f3, kachel: 'n' + w.kachel})));
    }
    /* aus den Lücken nur Wörter in der Lücke selbst - die Nachbarn neu gelesen
       ersetzten gute Wörter durch schlechtere (IMG_6676.v1) */
    const offenK = offen.map(x => ({x0: x.x0 - te, x1: x.x1 + te, y0: x.y0 - 4 * hh, y1: x.y1 + 8 * hh}));
    const drin = (w, k) => { const cx = (w.x0 + w.x1) / 2, cy = (w.y0 + w.y1) / 2; return cx >= k.x0 && cx <= k.x1 && cy >= k.y0 && cy <= k.y1; };
    neu = neu.filter(w => offenK.some(k => drin(w, k)) || luecken.some(l => drin(w, {x0: l.x0 + 0.2 * te, x1: l.x1 - 0.2 * te, y0: l.y0 - 4 * hh, y1: l.y1 + 8 * hh})));
    woerter = zusammenfuehren(woerter.concat(neu));
    g = geraeteFinden(woerter);
    nachlese += ' · gezielt: ' + kaesten.length + ' Bereiche, ' + neu.length + ' Wörter';
  }
  /* v1.2: Überspannungsableiter mit senkrechter Beschriftung (DEHNguard: rote
     Module, "DG MOD 275" hochkant) - die Texterkennung liest nur waagerechte
     Zeilen, von 16 Ableitern in den Lernsätzen fand sie einen. Zwei Beweise:
     große rote Flächen im Bild, und die um 90° gedrehte Fläche trägt DEHN/guard/
     MOD. Erst dann wird an der Stelle ein Wort "DEHNguard" eingesetzt. */
  if(!window.__ohneRot && !g.reihen.flatMap(r => r.geraete).some(x => x.art === 'Überspannungsableiter')){
    const rot = await rotFlaechenLesen(c, g);
    if(rot.length){
      woerter = woerter.concat(rot);
      g = geraeteFinden(woerter);
      nachlese += ' · rot: ' + rot.length + ' Ableiter';
    }
  }
  /* v1.3: Nummernstreifen, nach allem anderen - die Geräte bleiben, wie sie sind */
  if(!window.__ohneStreifen && g.reihen.some(r => r.geraete.length)) nachlese += ' · ' + await streifenLesen(c, g, woerter);
  melde(1);
  return {version: VERSION, rechner: rechnerText(), rechnerFehler: helferFehler, nachlese, h: Math.round(g.h || 0), te: Math.round(g.te || 0), dauer: (performance.now() - t0) / 1000, breite: c.width, hoehe: c.height,
          woerter, reihen: g.reihen.map(r => ({y: Math.round(r.y), te: Math.round(r.te), streifen: r.streifen || null,
            geraete: r.geraete.map(x => ({art: x.art, aufdruck: x.aufdruck || '', aufdruckSicher: x.aufdruckSicher !== false, vonBaugleichen: !!x.vonBaugleichen, marke: x.marke, streifen: x.streifen || '', streifenSicher: !!x.streifenSicher, x0: Math.round(x.x0), x1: Math.round(x.x1), y0: Math.round(x.y0), y1: Math.round(x.y1),
              anker: (x.anker || []).map(a => [a.w.text, Math.round(a.w.x0), Math.round(a.w.y0), Math.round(a.w.x1), Math.round(a.w.y1)]),
              hinweise: x.hinweise.map(h => h.text)}))}))};
}

window.__geraete = {starte, lies, version: VERSION, schwelle: v => { KARTEN_SCHWELLE = v; }, stand: () => schwelleStand + ' · ' + rechnerText()};
document.getElementById('start').onclick = async () => {
  document.getElementById('aus').textContent = 'lädt …';
  try{ await starte(); document.getElementById('datei').disabled = false; document.getElementById('aus').textContent = 'bereit'; }
  catch(e){ document.getElementById('aus').textContent = e.message; }
};
document.getElementById('datei').onchange = async e => {
  const d = e.target.files && e.target.files[0]; if(!d) return;
  document.getElementById('aus').textContent = 'liest …';
  const r = await lies(d);
  document.getElementById('aus').textContent = r.reihen.map((x, i) =>
    'Reihe ' + (i + 1) + ': ' + x.geraete.map(g => g.art + (g.aufdruck ? ' ' + g.aufdruck : '') + (g.marke ? ' (' + g.marke + ')' : '')).join(' · ')).join('\n') +
    '\n\n' + r.dauer.toFixed(1) + ' s · ' + r.rechner;
};

/* ==================== Einbettung in den E-Assistenten (v0.4) ====================
   Wie paddle-test.html: nur mit ?einbettung und nur für die eigene Herkunft.
   Die App schickt {sam:'lesen', id, bild} mit dem Verteilerfoto, die Seite
   antwortet mit {stand} und zum Schluss {fertig, ok, reihen} - je Reihe die
   Geräte von links nach rechts mit Art, Aufdruck und Marke. */
if(new URLSearchParams(location.search).has('einbettung') && window.parent !== window){
  let laeuft = Promise.resolve();
  window.addEventListener('message', e => {
    if(e.origin !== location.origin || e.source !== window.parent) return;
    const d = e.data || {};
    if(d.sam !== 'lesen' && d.sam !== 'vorbereiten') return;
    const antwort = x => window.parent.postMessage(Object.assign({sam:'antwort', id:d.id, version:VERSION}, x), location.origin);
    laeuft = laeuft.then(async () => {
      try{
        if(d.sam === 'vorbereiten'){ await vorladen(); antwort({bereit:true}); return; }
        antwort({stand:'Geräteerkennung wird geladen'});
        await vorladen();
        antwort({stand:'Verteiler wird gelesen'});
        let zuletzt = -1;
        const r = await lies(d.bild, a => { const p = Math.round(a * 100); if(p !== zuletzt){ zuletzt = p; antwort({stand: 'Verteiler wird gelesen', anteil: a}); } });
        const reihen = r.reihen.map(x => ({streifen: x.streifen, geraete: x.geraete.map(g => ({art: g.art, aufdruck: g.aufdruck, aufdruckSicher: g.aufdruckSicher, marke: g.marke,
          streifen: g.streifen, streifenSicher: g.streifenSicher, x0: g.x0, x1: g.x1, y0: g.y0, y1: g.y1, texte: g.anker.map(a => a[0])}))}));
        antwort({fertig:true, ok: reihen.some(x => x.geraete.length), reihen, h: r.h, te: r.te, rechner: r.rechner, rechnerFehler: r.rechnerFehler,
                 breite: r.breite, hoehe: r.hoehe, dauer: r.dauer, nachlese: r.nachlese});
      }catch(err){ antwort({fertig:true, ok:false, fehler: (err && err.message) ? err.message : String(err)}); }
    });
  });
  window.parent.postMessage({sam:'geladen', version:VERSION}, location.origin);
}
</script>
